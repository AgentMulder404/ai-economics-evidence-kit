name: Evidence kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: evidence-kit validate examples/*.jsonl
      - run: evidence-kit replay examples/healthy.jsonl --db demo.sqlite
      - run: evidence-kit replay examples/healthy.jsonl --db demo.sqlite
      - run: evidence-kit report --db demo.sqlite --intent intent-1 --coverage-source 'Synthetic fixture declaration'
      - run: python -m build
