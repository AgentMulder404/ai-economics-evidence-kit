[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-economics-evidence-kit"
version = "0.1.0"
description = "Validate AI economic evidence and its relationships"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "build==1.3.0"]

[project.scripts]
evidence-kit = "evidence_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_kit = ["schemas/v0.1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
